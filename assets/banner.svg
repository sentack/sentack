<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Sena Takele — Full-Stack &amp; DevOps Engineer</title>
<desc id="desc">4+ years shipping production SaaS, backend systems and AI-powered workflows. sentack.dev</desc>
<style>
  .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
  .rise { animation: rise 1s cubic-bezier(.16, 1, .3, 1) both; }
  .d1 { animation-delay: .1s; } .d2 { animation-delay: .22s; } .d3 { animation-delay: .36s; } .d4 { animation-delay: .5s; } .d5 { animation-delay: .7s; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .ping { animation: ping 2.2s cubic-bezier(.16, 1, .3, 1) infinite; transform-box: fill-box; transform-origin: center; }
  .breathe { animation: breathe 7s ease-in-out infinite; }
  .float { animation: float 6s ease-in-out infinite; }
  .float.b { animation-delay: -2s; } .float.c { animation-delay: -4s; } .float.e { animation-delay: -1s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes blink { 50% { fill-opacity: 0; } }
  @keyframes ping { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(3.4); } }
  @keyframes breathe { 50% { opacity: .55; } }
  @keyframes float { 50% { transform: translateY(-6px); } }
</style>
<defs>
  <clipPath id="frame"><rect width="900" height="300" rx="20"/></clipPath>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
  </pattern>
  <radialGradient id="gridFade" cx=".78" cy=".5" r=".62">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask"><rect width="900" height="300" fill="url(#gridFade)"/></mask>
  <radialGradient id="glow" cx=".8" cy=".2" r=".6">
    <stop offset="0" stop-color="#ff5f2e" stop-opacity=".34"/>
    <stop offset=".45" stop-color="#ff5f2e" stop-opacity=".07"/>
    <stop offset="1" stop-color="#ff5f2e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowLow" cx="0" cy="1" r=".55">
    <stop offset="0" stop-color="#ff8a5c" stop-opacity=".1"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="core" cx=".38" cy=".32" r=".7">
    <stop offset="0" stop-color="#ff8a5c" stop-opacity=".28"/>
    <stop offset=".6" stop-color="#ff5f2e" stop-opacity=".06"/>
    <stop offset="1" stop-color="#ff5f2e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="orbitStroke" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffb08f" stop-opacity=".1"/>
    <stop offset=".5" stop-color="#ff5f2e" stop-opacity=".9"/>
    <stop offset="1" stop-color="#ffb08f" stop-opacity=".1"/>
  </linearGradient>
</defs>

<g clip-path="url(#frame)">
  <rect width="900" height="300" fill="#070709"/>
  <rect width="900" height="300" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect class="breathe" width="900" height="300" fill="url(#glow)"/>
  <rect width="900" height="300" fill="url(#glowLow)"/>

  <!-- window chrome -->
  <circle cx="26" cy="25" r="5" fill="#ff5f57"/>
  <circle cx="44" cy="25" r="5" fill="#febc2e"/>
  <circle cx="62" cy="25" r="5" fill="#28c840"/>
  <text x="82" y="29" class="mono" font-size="11" fill="#6d6b74">sentack@prod: ~/profile</text>
  <text x="874" y="29" class="mono" font-size="11" fill="#45444b" text-anchor="end">zsh — 900×300</text>
  <line x1="0" y1="48.5" x2="900" y2="48.5" stroke="#ffffff" stroke-opacity=".07"/>

  <!-- globe: a nod to Three.js -->
  <g transform="translate(722 170)">
    <circle r="92" fill="url(#core)"/>
    <g fill="none" stroke="#ff5f2e" stroke-opacity=".35" stroke-width="1">
      <ellipse rx="92" ry="31.5"/>
      <ellipse cy="-43.2" rx="79.7" ry="27.3"/>
      <ellipse cy="43.2" rx="79.7" ry="27.3"/>
      <ellipse cy="-74.9" rx="46" ry="15.7"/>
      <ellipse cy="74.9" rx="46" ry="15.7"/>
    </g>
    <g fill="none" stroke="#ffb08f" stroke-opacity=".45" stroke-width="1">
      <ellipse rx="0" ry="92"><animate attributeName="rx" values="0;92;0" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".37 0 .63 1;.37 0 .63 1"/></ellipse>
      <ellipse rx="0" ry="92"><animate attributeName="rx" values="0;92;0" dur="10s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".37 0 .63 1;.37 0 .63 1"/></ellipse>
      <ellipse rx="0" ry="92"><animate attributeName="rx" values="0;92;0" dur="10s" begin="-5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".37 0 .63 1;.37 0 .63 1"/></ellipse>
      <ellipse rx="0" ry="92"><animate attributeName="rx" values="0;92;0" dur="10s" begin="-7.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".37 0 .63 1;.37 0 .63 1"/></ellipse>
    </g>
    <circle r="92" fill="none" stroke="#ff5f2e" stroke-opacity=".7" stroke-width="1.2"/>

    <g transform="rotate(-16)">
      <path id="orbit" d="M-150 0a150 40 0 1 0 300 0a150 40 0 1 0-300 0" fill="none" stroke="url(#orbitStroke)" stroke-width="1.2" stroke-dasharray="2 6"/>
      <circle r="9" fill="#ff5f2e" fill-opacity=".18">
        <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orbit" xlink:href="#orbit"/></animateMotion>
      </circle>
      <circle r="3.5" fill="#ff5f2e">
        <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orbit" xlink:href="#orbit"/></animateMotion>
      </circle>
    </g>
    <g transform="rotate(22)">
      <path id="orbit2" d="M-128 0a128 28 0 1 0 256 0a128 28 0 1 0-256 0" fill="none" stroke="#f3f1ec" stroke-opacity=".12"/>
      <circle r="2.5" fill="#f3f1ec">
        <animateMotion dur="14s" begin="-6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#orbit2" xlink:href="#orbit2"/></animateMotion>
      </circle>
    </g>
  </g>

  <!-- floating stack chips -->
  <g class="mono" font-size="11">
    <g class="float"><g transform="translate(538 84)">
      <rect width="74" height="24" rx="12" fill="#111115" stroke="#ffffff" stroke-opacity=".13"/>
      <circle cx="13" cy="12" r="3" fill="#ff5f2e"/>
      <text x="22" y="16" fill="#a3a1a8">next.js</text>
    </g></g>
    <g class="float b"><g transform="translate(796 70)">
      <rect width="78" height="24" rx="12" fill="#111115" stroke="#ffffff" stroke-opacity=".13"/>
      <circle cx="13" cy="12" r="3" fill="#ffb08f"/>
      <text x="22" y="16" fill="#a3a1a8">nestjs</text>
    </g></g>
    <g class="float c"><g transform="translate(556 240)">
      <rect width="88" height="24" rx="12" fill="#111115" stroke="#ffffff" stroke-opacity=".13"/>
      <circle cx="13" cy="12" r="3" fill="#28c840"/>
      <text x="22" y="16" fill="#a3a1a8">postgres</text>
    </g></g>
    <g class="float e"><g transform="translate(778 232)">
      <rect width="98" height="24" rx="12" fill="#111115" stroke="#ffffff" stroke-opacity=".13"/>
      <circle cx="13" cy="12" r="3" fill="#4285f4"/>
      <text x="22" y="16" fill="#a3a1a8">docker·gcp</text>
    </g></g>
  </g>

  <!-- intro -->
  <g class="rise d1">
    <circle class="ping" cx="52" cy="92" r="4" fill="#ff5f2e"/>
    <circle cx="52" cy="92" r="4" fill="#ff5f2e"/>
    <text x="66" y="96" class="mono" font-size="12" letter-spacing="3" fill="#ff5f2e">FULL-STACK &amp; DEVOPS ENGINEER</text>
  </g>
  <text class="rise d2 sans" x="44" y="162" font-size="64" font-weight="600" letter-spacing="-2" fill="#f3f1ec"><tspan class="sans">Sena</tspan><tspan class="serif" font-size="72" letter-spacing="-1" fill="#ff5f2e"> Takele</tspan></text>
  <g class="rise d3 sans" font-size="16" fill="#a3a1a8">
    <text x="48" y="202">4+ years shipping production SaaS platforms,</text>
    <text x="48" y="225">backend systems and AI-powered workflows.</text>
  </g>
  <text class="rise d4 mono" x="48" y="268" font-size="13" fill="#6d6b74"><tspan fill="#ff5f2e">❯</tspan> <tspan fill="#a3a1a8">deploy</tspan> --target=production <tspan fill="#28c840">✓</tspan> <tspan class="blink" fill="#ff5f2e">▍</tspan></text>
  <text class="rise d5 mono" x="874" y="284" font-size="11" letter-spacing="1" fill="#6d6b74" text-anchor="end">sentack.dev ↗</text>
</g>

<rect x=".5" y=".5" width="899" height="299" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
