name: Profile cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?color_snake=#f3f1ec&color_dots=#17171c,#4a1c0f,#8a3216,#d14a1f,#ff5f2e

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Stat cards
        run: node .github/scripts/profile-cards.mjs dist
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional PAT (scopes: repo, read:user) so private repos and contributions count too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile cards"
        env:
          GITHUB_TOKEN: ${{ github.token }}
